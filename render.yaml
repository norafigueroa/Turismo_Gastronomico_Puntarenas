# Render Blueprint: crea el back-end (Django) en el plan gratuito.
# La base de datos vive en Neon (Postgres); su URL se pega en DATABASE_URL al crear el servicio.
services:
  - type: web
    name: sabor-gastronomico-api
    runtime: python
    plan: free
    rootDir: Back-end/gastronomia
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # El plan gratuito no permite "pre-deploy command", así que migrate y crear_grupos van al arrancar
    # (ambos son idempotentes, tardan segundos si no hay nada nuevo).
    startCommand: python manage.py migrate --noinput && python manage.py crear_grupos && gunicorn gastronomia.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
